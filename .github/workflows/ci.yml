name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heder1
          POSTGRES_PASSWORD: heder1_test
          POSTGRES_DB: heder1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heder1 -d heder1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEDER1_TEST_DATABASE_URL: postgresql://heder1:heder1_test@localhost:5432/heder1_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: API unit and integration tests
        run: pnpm --filter @heder1/api test
      - name: Type-check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
